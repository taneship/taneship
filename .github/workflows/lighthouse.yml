name: lighthouse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: production
      APP_DEBUG: false
      INERTIA_SSR_THROW_ON_ERROR: true
      VP_GIT_HOOKS: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: npm ci

      - run: cp .env.example .env && php artisan key:generate

      # Sessions and cache live in the database.
      - run: touch database/database.sqlite && php artisan migrate --force

      - run: npm run build

      - run: php artisan optimize

      - name: Start the application
        run: |
          php artisan inertia:start-ssr > "$RUNNER_TEMP/ssr.log" 2>&1 &
          # .env.example serves localhost, which may resolve to ::1: the proxy below expects 127.0.0.1.
          php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/serve.log" 2>&1 &

          # php artisan serve compresses nothing, where every production server does: Caddy compresses
          # its responses, as one would.
          printf ':8080 {\n\tencode zstd gzip\n\treverse_proxy 127.0.0.1:8000\n}\n' > "$RUNNER_TEMP/Caddyfile"
          docker run --detach --network host --volume "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile" caddy:2.11

          curl --silent --fail --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://127.0.0.1:8080/

      - run: npx --yes @lhci/cli@0.15.1 autorun

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
