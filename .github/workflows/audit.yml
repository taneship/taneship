name: audit

on:
  push:
    branches: [main]
  pull_request:
  # A new advisory appears without any commit.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  composer:
    name: composer audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      # The gate is known advisories. Abandoned packages show in the log without failing it: a dev
      # tool can depend on one that nothing replaces, as rector-laravel does today.
      - run: composer audit --locked --abandoned=report

  npm:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # TEMPORARY: GHSA-vfj7-8cjw-p6xm affects every release of braces (up to 3.0.3) and no fixed
      # version exists. Only the shadcn dev dependency reaches it, through fast-glob and ts-morph, so
      # the gate covers the dependencies that ship, and the full audit runs below without failing the
      # job. Once a fixed braces is out, run `npm update braces`, delete the report step, and drop
      # --omit=dev, so dev dependencies are gated again.
      - run: npm audit --audit-level=high --omit=dev

      - name: npm audit, dev dependencies included (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
