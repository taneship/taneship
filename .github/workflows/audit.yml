name: audit

on:
  push:
    branches: [main]
  pull_request:
  # A new advisory appears without any commit.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  composer:
    name: composer audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      # The gate is known advisories. Abandoned packages show in the log without failing it: a dev
      # tool can depend on one that nothing replaces, as rector-laravel does today.
      - run: composer audit --locked --abandoned=report

  npm:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm audit --audit-level=high
